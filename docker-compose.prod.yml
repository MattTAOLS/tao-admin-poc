# TAO Admin POC, production. Builds every image from the repo root (see deploy/), keeps no source on the host, and
# publishes one port: the web server, which serves the built app and passes /api to the API.
#   cp .env.production.example .env      # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api python -m app.seed      # first install only, see docs/hosting.md
# The development stack (docker-compose.yml) is unchanged and is still what the build agents and the e2e demo use.
name: tao-admin

x-common: &common
  restart: unless-stopped
  env_file: .env
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

x-db: &db
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tao}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tao_admin}"
  REDIS_URL: "redis://redis:6379/0"

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tao_admin}
    volumes: ["pgdata:/var/lib/postgresql/data"]          # schema comes from the API's migration runner on start-up
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""], interval: 5s, timeout: 3s, retries: 20 }
    # no ports: reachable only by the other containers

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]       # queued jobs survive a restart
    volumes: ["redisdata:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  api:
    <<: *common
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    image: tao-admin/api:latest
    environment: { <<: *db, FILE_STORE: /data, MIGRATIONS_DIR: /migrations }
    volumes: ["filestore:/data"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *common
    build: { context: ., dockerfile: deploy/worker.Dockerfile }
    image: tao-admin/worker:latest
    environment: { <<: *db, FILE_STORE: /data }
    volumes: ["filestore:/data"]
    depends_on: { api: { condition: service_healthy } }    # the API applies migrations first

  news:
    <<: *common
    build: { context: ., dockerfile: deploy/news.Dockerfile }
    image: tao-admin/news:latest
    environment: { <<: *db, NEWS_QUEUE: news }
    depends_on: { api: { condition: service_healthy } }

  web:
    <<: *common
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    image: tao-admin/web:latest
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata: {}
  redisdata: {}
  filestore: {}
