services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: tao, POSTGRES_PASSWORD: tao, POSTGRES_DB: tao_admin }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tao -d tao_admin"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./api
    env_file: .env
    environment: { DATABASE_URL: "postgresql+psycopg://tao:tao@postgres:5432/tao_admin", REDIS_URL: "redis://redis:6379/0", FILE_STORE: /data }
    volumes: ["./api:/app", "./rules:/app/rules", "./contracts:/app/contracts:ro", "./seed:/app/seed:ro", "filestore:/data"]
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  worker:
    build: ./worker
    env_file: .env
    environment: { DATABASE_URL: "postgresql+psycopg://tao:tao@postgres:5432/tao_admin", REDIS_URL: "redis://redis:6379/0", FILE_STORE: /data }
    volumes: ["./worker:/app", "./rules:/app/rules", "./contracts:/app/contracts:ro", "filestore:/data"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    command: python -m worker.main
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./web:/app", "./contracts:/contracts:ro"]
    ports: ["5173:5173"]
    environment: { VITE_API_URL: "http://localhost:8000/api/v1" }
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
volumes:
  pgdata: {}
  filestore: {}
