openapi: 3.1.0
info:
  title: TAO Admin POC API
  version: 0.1.0
  description: |
    Day-0 contract for the SetRep intake POC. Every request carries `X-Role` and, for partner roles,
    `X-Partner`. Intake routes (uploads, findings, reviews, master data, audit) are TAO-only; `/published/*`
    is readable by every role but filtered to the caller's partner. Changes to this file go through the
    Lead only. The UI agents build against a mock server generated from this file (`make mock`).

    Callers (wave C, risk R1). Any request may also carry `X-User`, an app_user id (parameter XUser; listed on the wave C
    routes, accepted on every route). When it does and the user is active,
    the caller's role and partner come from that user and `X-Role` / `X-Partner` are ignored; a deactivated user gets
    401 `inactive_user`, an unknown id 401 `unknown_user`. Without `X-User` the demo headers work exactly as before
    (demo mode, kept for the role switcher and every existing test) and the caller has no user. Either way the API builds
    the same caller (role, partner), so every permission check and `partner_filter` are unchanged. Routes about one
    person (`/me`, `/notifications`, comments) need a user and return 401 `user_required` without one. Real sign-in
    (password, two-step) is a production item; `X-User` is the seam it will fill.

    Email is not sent in phase 2 (in-app only). Where a schema reserves an email channel, sending it is refused with
    422 `email_later` and the UI shows it as "coming later". Partner notifications are created only while the setting
    `partner_notifications_enabled` is true (default false). Nothing is hard-deleted: users are deactivated, and data is
    kept indefinitely except notifications, which are kept 12 months.

    Companies (wave D). A company groups the deals of one lending company (TLFC's three MOVE Trust deals are one company).
    Every figure on the company pages comes from published deal objects, the same ones `/published/*` serves; nothing is
    re-extracted and nothing new is typed in for a number. A partner reaches `/companies*` only while the setting
    `company_profiles_partner_enabled` is true (default false; otherwise 404 `not_found`, as for anything it cannot see), and
    then only companies with a deal in a program shared with it, through `partner_filter`, showing only those deals. Notes
    are TAO-only and never leave the TAO routes. News and adverse media come from a separate news worker (its own container
    and queue, never the extraction queue) that searches free sources (Google News RSS, GDELT) by company name and aliases
    once a day while `company_feeds.enabled` is true; sentiment and the five adverse categories come from our own keyword
    screening. Partners see adverse items only once a TAO Admin marks them reviewed.

    News screening version 2 (wave E, docs/phase2/tao-admin-poc-news_Architecture_v1.md). Paid sources (Event Registry,
    NewsCatcher, Brave; Dow Jones and LexisNexis once a client supplies their API documentation) join the free two, each
    switched on in System settings with the client's own credentials. Credentials are write-only: stored encrypted with
    NEWS_SECRET_KEY from the server's .env, and only their last four characters ever leave the API. Every new story passes
    a Claude check (is it about this company; adverse or not, which categories; sentiment) and a date check (published_at
    comes only from the article itself or a provider's publication field; the search source's own date is source_date).
    Stories the check excludes are kept, never deleted, and shown to TAO only on request. Counts ("last 7 days") and
    negative_news / adverse_media notifications use kept stories with a confirmed date only.
servers:
  - url: http://localhost:8000/api/v1

components:
  parameters:
    XRole:
      name: X-Role
      in: header
      required: false
      description: >
        Demo mode caller role; required when X-User is absent (neither header: 422 `invalid`, as before). Ignored when
        X-User is sent; the user's role applies.
      schema:
        type: string
        enum: [tao_admin, tao_analyst, investor_admin, investor_viewer, manager_admin, manager_viewer]
    XPartner:
      name: X-Partner
      in: header
      required: false
      description: Partner slug; required for investor_* and manager_* roles in demo mode. Ignored when X-User is sent.
      schema: { type: string }
    XUser:
      name: X-User
      in: header
      required: false
      description: >
        An app_user id. When the user is active, role and partner come from the user record and X-Role / X-Partner are
        ignored. Deactivated user: 401 `inactive_user`; unknown id: 401 `unknown_user`. Absent: demo mode (X-Role,
        X-Partner) with no user.
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: '`unknown_user` or `inactive_user` (X-User), or `user_required` (the route is about one person and no X-User was sent).'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Role may not call this route, or partner does not own the resource.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found (also returned when a partner asks for another partner's resource).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Request is valid but the resource's state forbids it; `code` says why (see Error).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Invalid:
      description: Request does not match the contract or names an unknown record; `code` says which (see Error).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        Every error is `{code, message}` at the top level (422 may add `errors[]` with field detail). Codes:
        401 `unknown_user`, `inactive_user` (X-User), `user_required` (route about one person, no X-User);
        403 `forbidden`, `bad_role` (unknown X-Role), `bad_partner` (X-Partner missing or not the caller's), `tao_only`,
        `admin_only`, `company_admin_only` (users routes: tao_admin or the partner's Company Admin), `not_author`
        (edit someone else's comment); 404 `not_found`;
        409 (users) `self_change` (own role or own deactivation), `last_admin` (would leave no active tao_admin, or a
        partner without an active Company Admin), `other_partner` (a Company Admin naming another partner or a TAO role),
        `email_taken`, `already_active`, `already_deactivated`. A Company Admin asking for another partner's user gets 404;
        409 (threads) `bad_state` (comment on a resolved thread; resolve a resolved one; reopen an open one);
        409 (companies) `slug_taken`, `bad_state` (review or dismiss an adverse item that is not open), `run_active` (a news
        run is already queued or running), `feeds_off` (Run now while company_feeds.enabled is false);
        409 (news sources) `no_secret_key` (NEWS_SECRET_KEY is not set on the server, so credentials cannot be stored),
        `not_available` (switching on Dow Jones or LexisNexis before their adapter exists), `missing_credentials` (switching
        on or testing a source whose required secret fields are not all set), `run_active` (re-check while a run is queued
        or running);
        409 `already_published` (period published for this deal and `replace` not set; R12 pre-check), `upload_in_progress` (another active
        upload for deal + period), `bad_state` (action not allowed in the upload's status), `open_block_findings`
        (approve while a block finding is open), `not_open` (override of a resolved finding), `no_extraction`,
        `no_target` (use_ours / use_report on a finding without `targets`),
        `conflicting_corrections` (approve: resolved choices write different values to the same pointer; body adds
        `conflicts`), `correction_inconsistent` (approve: re-running the rules on the corrected deal raises a block
        finding no resolved finding covers; body adds `findings`; nothing is published);
        422 `invalid` (also a missing X-Role), `unknown_deal`, `unknown_program`, `unknown_partner`, `not_a_pdf`,
        `nothing_to_replace` (`replace` set but the period has no publication), `role_partner_mismatch` (TAO role with a
        partner_slug, or a partner role without its own partner), `email_later` (email channel requested; in-app only in
        phase 2), `not_visible` (subscription to a program not shared with the user's partner), `bad_mention` (mention of
        a user who is not an active TAO user), `required` (switching off a notification kind that cannot be switched
        off), `unknown_setting`.
      properties:
        code: { type: string }
        message: { type: string }
        errors: { type: array, items: { type: object } }
        conflicts:
          type: array
          items:
            type: object
            properties:
              pointer: { type: string }
              values: { type: array, items: { type: number } }
              finding_ids: { type: array, items: { type: string } }
              rule_ids: { type: array, items: { type: string } }
        findings:
          type: array
          items:
            type: object
            properties:
              rule_id: { type: string }
              message: { type: string }
              fields: { type: array, items: { type: string } }
              our_value: {}
              report_value: {}
    Partner:
      type: object
      required: [slug, name, kind, status]
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [investor, manager] }
        status: { type: string, default: active }
    UploadStatus:
      type: string
      enum: [received, extracting, needs_review, approved, rejected, published, extraction_failed]
    Upload:
      type: object
      required: [id, deal_slug, program_slug, partner_slug, collection_period, status, uploaded_by, uploaded_at, file_name]
      properties:
        id: { type: string, format: uuid }
        deal_slug: { type: string }
        program_slug: { type: string }
        partner_slug: { type: string, description: "the program's first partner (kept for compatibility); see partner_slugs" }
        partner_slugs: { type: array, items: { type: string }, description: 'every partner who sees this program' }
        collection_period: { type: string, pattern: '^\d{4}-\d{2}$', description: 'YYYY-MM, = settlement month (see docs: period naming)' }
        reporting_period: { type: [string, 'null'], pattern: '^\d{4}-\d{2}$' }
        status: { $ref: '#/components/schemas/UploadStatus' }
        file_name: { type: string }
        page_count: { type: [integer, 'null'] }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        finding_counts:
          type: object
          properties: { block: { type: integer }, review: { type: integer }, note: { type: integer } }
        latest_extraction_id: { type: [string, 'null'], format: uuid }
        published_at: { type: [string, 'null'], format: date-time }
        reject_reason: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'], description: 'set while status is extraction_failed: why extraction failed (the worker error, or queue unavailable), from the audit row that failed it' }
        replaces_upload_id: { type: [string, 'null'], format: uuid, description: 'set on a corrected re-issue: the upload whose publication this one replaces on approve' }
        replaced_by_upload_id: { type: [string, 'null'], format: uuid, description: 'set on a published upload once a re-issue for its period has been approved' }
        active_edit_count: { type: integer, description: 'values with an edit in force on this upload (a chain of edits on one pointer counts once)' }
        published_version: { type: [integer, 'null'], description: 'current publication version of this upload; null until published' }
        pending_correction_id: { type: [string, 'null'], format: uuid, description: 'a correction waiting in the approval queue' }
    Extraction:
      description: See contracts/extraction.schema.json (meta, deal, sources) plus id.
      type: object
      required: [id, upload_id, meta, deal, sources]
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        pass: { type: integer, enum: [1, 2] }
        confidence: { type: [number, 'null'] }
        created_at: { type: string, format: date-time }
        meta: { type: object, description: 'includes history.carried / history.extended_from when earlier months were chained from a publication' }
        deal: { type: object }
        sources: { type: object }
    Finding:
      description: See contracts/finding.schema.json.
      type: object
    OverrideRequest:
      type: object
      required: [choice, reason]
      description: |
        use_ours / use_report: the finding must carry `targets` (else 409 `no_target`). On approve, the chosen value
        (our_value or report_value) is written to every pointer in `targets` in the published deal, and one entry per
        pointer is appended to deal.data_corrections {period, record, field, old_value, new_value, applied, reason,
        rule_id, choice, finding_id}. When the chosen value equals what the extraction already holds (typically
        use_report), nothing changes and no correction is written.
        restatement / acknowledge: the decision is recorded; no value changes.
      properties:
        choice: { type: string, enum: [use_ours, use_report, restatement, acknowledge] }
        reason: { type: string, minLength: 3 }
    ReextractRequest:
      type: object
      required: [pages]
      properties:
        pages: { type: array, items: { type: integer, minimum: 1 }, minItems: 1 }
    RejectRequest:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 3 } }
    Program:
      type: object
      required: [slug, name, partner_slug, currency, limit]
      properties:
        slug: { type: string }
        name: { type: string }
        partner_slug: { type: string, description: 'first partner, kept for compatibility; on PUT without partner_slugs it sets partner_slugs = [partner_slug]' }
        partner_slugs: { type: array, items: { type: string }, minItems: 1, description: 'every partner who sees this program (investor and manager may both)' }
        currency: { type: string, default: CAD }
        limit: { type: number }
        warehouse_limit: { type: [number, 'null'] }
    Deal:
      type: object
      required: [slug, name, program_slug, servicer, template_id]
      properties:
        slug: { type: string }
        name: { type: string }
        program_slug: { type: string }
        servicer: { type: string }
        template_id: { type: string, description: 'extraction mapping, e.g. fpil-2.0-settrep-v1' }
    CovenantDefinition:
      type: object
      required: [deal_slug, legal_ref, description, kind, effective_from]
      properties:
        id: { type: string, format: uuid, description: 'always returned; omit on PUT to create a new definition or version' }
        deal_slug: { type: string }
        legal_ref: { type: string, example: 'SLFA 9.1 (f)' }
        description: { type: string }
        kind: { type: string, enum: [ceiling, floor] }
        threshold: { type: [number, 'null'], description: 'see unit; null when threshold_rule applies' }
        unit: { type: [string, 'null'], enum: [fraction, ratio, currency, null], description: 'fraction: 0.035 = 3.5%; ratio: 1.10 = 1.10x; currency: an amount' }
        threshold_rule:
          type: [object, 'null']
          description: 'Conditional thresholds, e.g. SLFA 9.1(c): 0.06 if portfolio NPV ≤ 10,000,000 else 0.04'
          properties:
            on: { type: string, description: 'JSON pointer into deal, e.g. /tranche_balance/closing' }
            bands:
              type: array
              items:
                type: object
                required: [threshold]
                properties: { lte: { type: number }, gt: { type: number }, threshold: { type: number } }
        watch_buffer_pct: { type: number, default: 0.1 }
        effective_from: { type: string, format: date }
        source: { type: [string, 'null'], description: 'e.g. SLFA dated 2022-12-09; Amendment 2 2025-03-01' }
        origin: { type: string, enum: [seed, ui], readOnly: true, description: 'seed rows may be superseded by a later seed run; ui rows never are' }
        superseded_at: { type: [string, 'null'], format: date-time, readOnly: true, description: 'set when a correction or a seed run replaced this row; returned only with include_history=true' }
        supersedes_id: { type: [string, 'null'], format: uuid, readOnly: true, description: 'the row this one corrected (mode=correct)' }
        changed_by: { type: [string, 'null'], readOnly: true, description: 'role or user label of the last change; null for seed rows' }
        change_reason: { type: [string, 'null'], readOnly: true }
        changed_at: { type: [string, 'null'], format: date-time, readOnly: true, description: 'when this row was saved; null for seed rows' }
    CovenantChange:
      description: |
        Body of PUT /master/covenants (TAO Admin). A change never updates a row in place.
        mode=new_version: `id` omitted; inserts a definition with a later `effective_from` (an amendment). Earlier periods keep the old version.
        mode=correct: `id` of the current row; that row gets superseded_at and a new row with the same effective_from replaces it
        (supersedes_id points back). Use it to fix a mistake in the definition itself.
        mode=add: `id` omitted; a covenant new to this deal (no row with this legal_ref yet).
        Every change writes a master_change audit entry with before/after and the reason, and re-runs the rules on that deal's
        uploads in needs_review, so their R14 findings reflect the change. Published periods are not touched.
      allOf:
        - { $ref: '#/components/schemas/CovenantDefinition' }
        - type: object
          required: [mode, reason]
          properties:
            mode: { type: string, enum: [new_version, correct, add] }
            reason: { type: string, minLength: 10 }
    CovenantChangeResult:
      type: object
      required: [definition, rerun_upload_ids]
      properties:
        definition: { $ref: '#/components/schemas/CovenantDefinition' }
        superseded_id: { type: [string, 'null'], format: uuid }
        rerun_upload_ids: { type: array, items: { type: string, format: uuid }, description: 'uploads in needs_review whose rules were re-run' }
    ValueEdit:
      type: object
      required: [id, upload_id, pointer, old_value, new_value, reason, actor_role, at]
      description: |
        A TAO Admin's change to one extracted number while the report is in review (needs_review or approved). Stored beside the
        extraction (the extraction row is not rewritten); the rules re-run on the extraction with every active edit applied. On
        approve each active edit is written to the published deal and appended to deal.data_corrections with choice `manual`.
        A later edit on a pointer replaces an earlier use_ours / use_report on the same pointer; both stay in the audit log.
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        correction_id: { type: [string, 'null'], format: uuid, description: 'set when the edit belongs to a post-publish correction' }
        pointer: { type: string, description: 'JSON pointer into extraction.deal, e.g. /financial_ratios/total_equity' }
        old_value: { type: number, description: 'the value before this edit (extracted, or the previous edit)' }
        new_value: { type: number }
        reason: { type: string, minLength: 10 }
        source_page: { type: [integer, 'null'], description: 'page of the value, from sources' }
        actor_role: { type: string }
        actor_label: { type: [string, 'null'] }
        at: { type: string, format: date-time }
        reverted_at: { type: [string, 'null'], format: date-time }
        reverted_by: { type: [string, 'null'] }
        revert_reason: { type: [string, 'null'] }
    ValueEditRequest:
      type: object
      required: [pointer, value, reason]
      properties:
        pointer: { type: string }
        value: { type: number }
        reason: { type: string, minLength: 10 }
    ValueEditResult:
      type: object
      required: [edit, finding_counts]
      properties:
        edit: { $ref: '#/components/schemas/ValueEdit' }
        finding_counts: { type: object, properties: { block: { type: integer }, review: { type: integer }, note: { type: integer } }, description: 'open findings after the rules re-ran' }
    Correction:
      type: object
      required: [id, upload_id, status, version, edits, reason, created_at, created_by]
      description: |
        A corrected re-issue (POST /uploads with replace=true) also archives the old publication and becomes the next version.
        A change to a published report without a new PDF. The rules re-run on the published deal with the edits applied.
        With no open block finding it is published straight away as the next version; otherwise it waits in the approval queue
        (status needs_review) and the current version stays live until a TAO Admin approves or rejects it. When it publishes,
        a correction_published notification goes to the deal's subscribers (see Notification), with `note_to_partners` as
        note_from_tao and the changed fields as `changes`.
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        deal_slug: { type: string }
        collection_period: { type: string }
        status: { type: string, enum: [needs_review, published, rejected] }
        version: { type: integer, minimum: 2, description: 'the publication version this correction becomes' }
        edits: { type: array, items: { $ref: '#/components/schemas/ValueEdit' } }
        reason: { type: string, minLength: 10 }
        note_to_partners: { type: [string, 'null'] }
        finding_counts: { type: object, properties: { block: { type: integer }, review: { type: integer }, note: { type: integer } } }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        decided_at: { type: [string, 'null'], format: date-time }
        decided_by: { type: [string, 'null'] }
        reject_reason: { type: [string, 'null'] }
    CorrectionRequest:
      type: object
      required: [edits, reason]
      properties:
        edits: { type: array, minItems: 1, items: { type: object, required: [pointer, value], properties: { pointer: { type: string }, value: { type: number } } } }
        reason: { type: string, minLength: 10 }
        note_to_partners: { type: [string, 'null'], maxLength: 2000 }
    PublicationVersion:
      type: object
      required: [version, published_at, published_by]
      properties:
        version: { type: integer, minimum: 1 }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        correction_id: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'], description: 'the correction reason, or "corrected re-issue" when a re-issued report replaced the publication' }
        note_to_partners: { type: [string, 'null'] }
        current: { type: boolean }
    DealIndexEntry:
      type: object
      required: [deal_slug, deal_name]
      properties:
        deal_slug: { type: string }
        deal_name: { type: string }
        collection_period: { type: string }
        worst_status: { type: string, enum: [OK, WATCH, BREACH] }
        covenant_summary: { type: object }
        closing_tranche_balance: { type: [number, 'null'] }
    PublishedPortfolio:
      type: object
      description: Program-level aggregates for every program the caller's partner sees.
      required: [partner, programs]
      properties:
        partner: { type: [string, 'null'] }
        programs:
          type: array
          items:
            type: object
            description: The program aggregate (program-*.dashboard.json shape) minus its deals[], plus the fields below.
            additionalProperties: true
            properties:
              program: { $ref: '#/components/schemas/Program' }
              available_periods: { type: array, items: { type: string } }
              deals: { type: array, items: { $ref: '#/components/schemas/DealIndexEntry' } }
    PublishedProgram:
      type: object
      description: One program aggregate = docs/dashboard-json/program-<slug>.dashboard.json shape, plus the fields below.
      additionalProperties: true
      properties:
        program: { $ref: '#/components/schemas/Program' }
        available_periods: { type: array, items: { type: string } }
        deals_behind:
          type: array
          description: >
            Deals in this aggregate whose newest publication is earlier than `period`. A program's month lists every
            deal: each deal contributes its latest publication at or before `period`, so a deal still waiting for
            approval shows its last published month instead of dropping out. Empty when every deal is current.
          items:
            type: object
            required: [deal_slug, as_of]
            properties:
              deal_slug: { type: string }
              deal_name: { type: string }
              as_of: { type: string, description: the collection_period of the publication used }
    PublishedDeal:
      type: object
      description: One deal = the published extraction.deal (dashboard.json deal object, data_corrections included) plus the publication fields below.
      additionalProperties: true
      properties:
        published_period: { type: string }
        available_periods: { type: array, items: { type: string } }
        upload_id: { type: [string, 'null'], format: uuid }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        version: { type: integer, description: 'the publication version shown (1 = original, 2+ = corrections)' }
        versions: { type: array, items: { $ref: '#/components/schemas/PublicationVersion' } }
    RegenerateResult:
      type: object
      properties:
        queued: { type: boolean }
        programs: { type: array, items: { type: string } }
        publications: { type: integer }
    AuditEntry:
      type: object
      required: [id, at, actor_role, action, upload_id]
      description: |
        Scope is derived from the action. Reports: every action that carries an upload_id, plus publish and regenerate;
        the wave C comment actions are Reports (comment, comment_edit, thread_resolve, thread_reopen; they always carry
        the upload_id). Platform: everything else, including master_change, export and the wave C user_change,
        prefs_change and settings_change (no upload_id).
        Wave C detail shapes: user_change {user_id, partner_slug, change: created|updated|deactivated|reactivated|subscriptions,
        before, after}; prefs_change {user_id, before, after}; settings_change {key, before, after}; comment {thread_id,
        comment_id, anchor, body, mentions}; comment_edit {thread_id, comment_id, before, after}; thread_resolve and
        thread_reopen {thread_id}. Approve with a note adds {note_to_partners, recipients} to the publish entry.
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor_role: { type: string }
        actor_label: { type: string }
        actor_user_id: { type: [string, 'null'], format: uuid, description: 'set when the caller sent X-User; null in demo mode' }
        action: { type: string, enum: [upload, extract, reextract, override, restate, approve, reject, publish, regenerate, master_change, export, value_edit, value_edit_revert, correction, correction_approve, correction_reject, user_change, prefs_change, settings_change, comment, comment_edit, thread_resolve, thread_reopen, company_change, company_note, company_note_edit, adverse_change, news_run, news_source_change] }
        upload_id: { type: [string, 'null'], format: uuid }
        finding_id: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
        detail: { type: object }
        deal_slug: { type: [string, 'null'], description: 'the upload''s deal, or detail.deal_slug; null for platform entries without a deal' }
        deal_name: { type: [string, 'null'] }
        collection_period: { type: [string, 'null'], description: 'YYYY-MM of the upload (MOVE Trust: the report''s own month; F-PIL: the settlement month)' }

    Role:
      type: string
      enum: [tao_admin, tao_analyst, investor_admin, investor_viewer, manager_admin, manager_viewer]
    AppUser:
      type: object
      required: [id, email, name, role, partner_slug, status, created_at]
      description: |
        A person. TAO roles have partner_slug null; investor_* and manager_* roles carry their own partner. There is no
        hard delete: a deactivated user cannot call the API (401 `inactive_user`) and keeps their name on uploads,
        comments and audit rows. Reactivate restores the same account.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, description: unique }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        partner_slug: { type: [string, 'null'] }
        status: { type: string, enum: [active, deactivated] }
        created_at: { type: string, format: date-time }
        last_active_at: { type: [string, 'null'], format: date-time }
        deactivated_at: { type: [string, 'null'], format: date-time }
        deactivation_reason: { type: [string, 'null'] }
        receives_summary: { type: string, readOnly: true, description: 'one line from the subscriptions, e.g. "All MOVE Trust deals; Moneda Capital Corp. (F-PIL 2.0)"; "Nothing yet" when empty' }
    AppUserCreate:
      type: object
      required: [email, name, role]
      description: 'partner_slug is required for partner roles and must be null for TAO roles (422 `role_partner_mismatch`). No invite email in phase 2.'
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Role' }
        partner_slug: { type: [string, 'null'] }
    AppUserPatch:
      type: object
      minProperties: 1
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Role' }
        partner_slug: { type: [string, 'null'] }
    StatusChangeRequest:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 3 } }
    Subscription:
      type: object
      required: [program_slug, deal_slug, channels]
      description: |
        Which reports a user is notified about. deal_slug null = every deal in the program, including deals added later;
        a deal entry overrides the program entry's channels for that deal. Subscriptions only decide who is notified;
        they never widen what a partner can see (reads still go through partner_filter). Mentions reach a person
        whatever they subscribe to.
      properties:
        program_slug: { type: string }
        deal_slug: { type: [string, 'null'] }
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [in_app, email] }
          description: '[in_app] in phase 2; email is reserved and refused with 422 `email_later`'
    Me:
      type: object
      required: [user, role, partner_slug, display, features]
      properties:
        user: { oneOf: [ { $ref: '#/components/schemas/AppUser' }, { type: 'null' } ], description: 'null in demo mode (no X-User)' }
        features:
          type: object
          required: [companies]
          description: 'What the shell may show this caller. companies: true for TAO roles; for partner roles, the setting company_profiles_partner_enabled.'
          properties:
            companies: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        partner_slug: { type: [string, 'null'] }
        display: { $ref: '#/components/schemas/DisplayPrefs' }
    DisplayPrefs:
      type: object
      description: 'Display only; stored figures never change. Defaults apply in demo mode.'
      properties:
        time_zone: { type: string, default: America/Toronto, description: IANA zone }
        date_format: { type: string, enum: ['D MMM YYYY', 'YYYY-MM-DD', 'MM/DD/YYYY', 'DD/MM/YYYY'], default: 'D MMM YYYY' }
        number_format: { type: string, enum: ['1,234.56', '1 234,56'], default: '1,234.56' }
    MePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        time_zone: { type: string }
        date_format: { type: string, enum: ['D MMM YYYY', 'YYYY-MM-DD', 'MM/DD/YYYY', 'DD/MM/YYYY'] }
        number_format: { type: string, enum: ['1,234.56', '1 234,56'] }
    NotificationKind:
      type: string
      enum: [mention, reply, report_needs_review, report_published, correction_published, covenant_changed, report_rejected, user_change, system, adverse_media, negative_news, report_late]
      description: |
        Wave D kinds. adverse_media: a new adverse item, to TAO users who follow the company; to partner users who follow
        it when a TAO Admin marks the item reviewed (partner flags permitting). negative_news: a news item screened
        Negative, to followers (partners too, flags permitting). report_late: a deal's next report not received 5 business
        days after its due date, to TAO users subscribed to the deal, once per deal and period (TAO only, decision S3).
        All three sit in the reports tab and can be switched off. A mention in a company note is kind mention.
    NotificationPref:
      type: object
      required: [kind, in_app, digest]
      description: |
        One row per kind the role can receive; GET returns every such kind, defaults (setting notification_defaults)
        filled in. covenant_changed (WATCH / BREACH) and correction_published are `required`: in_app false is refused
        with 422 `required`. digest is stored now and used by the email channel when it arrives; in-app items always
        arrive at once.
      properties:
        kind: { $ref: '#/components/schemas/NotificationKind' }
        in_app: { type: boolean }
        digest: { type: string, enum: [instant, daily] }
        required: { type: boolean, readOnly: true }
    Notification:
      type: object
      required: [id, kind, title, link, created_at, read_at]
      description: |
        Only ever the caller's own. Partner roles receive only report_published, correction_published and user_change.
        Events the worker causes (needs review, extraction failed, R19 status moves) are picked up when someone next reads
        notifications or the badge polls (at most a minute later), not at the moment they happen. Who gets what:
        report_published and correction_published: users subscribed to the deal (directly or through its program), at a
        partner the program is shared with (the partner_filter rule), plus subscribed TAO users. Partner users get them
        only while the setting partner_notifications_enabled is true.
        report_needs_review, report_rejected, covenant_changed, system (e.g. extraction failed): subscribed TAO users.
        mention: the mentioned user. reply: the other people in the thread. user_change: the user whose account or
        subscriptions changed.
        A kind the user switched off (NotificationPref.in_app false) is not created. A partner's list is filtered through
        partner_filter again on read, so a program TAO stops sharing drops out. Kept 12 months.
        Tabs: mentions = mention, reply; reports = report_needs_review, report_published, correction_published,
        covenant_changed, report_rejected; system = user_change, system.
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        title: { type: string }
        body: { type: [string, 'null'] }
        link: { type: string, description: 'app route. Review, mention, reply, rejected and extraction failed: /admin/uploads/queue/<upload_id> (?thread=<id> for a thread). Published and corrections: /admin/portfolio/<program>/deals/<deal>?period=YYYY-MM for TAO, /<investor|manager>/portfolio/<program>/deals/<deal>?period=YYYY-MM for partners. covenant_changed: /admin/partners/<partner>/programs/<program>. user_change: /admin/settings/users, or /settings/profile for a partner.' }
        upload_id: { type: [string, 'null'], format: uuid }
        deal_slug: { type: [string, 'null'] }
        collection_period: { type: [string, 'null'] }
        version: { type: [integer, 'null'], description: 'publication version for report_published / correction_published' }
        thread_id: { type: [string, 'null'], format: uuid, description: 'mention and reply' }
        note_from_tao: { type: [string, 'null'], description: 'the approve or correction note_to_partners, exactly as typed; signed by TAO, not the person' }
        changes:
          type: [array, 'null']
          description: 'correction_published: the changed fields, old to new'
          items: { type: object, properties: { pointer: { type: string }, label: { type: string }, old_value: { type: number }, new_value: { type: number } } }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    UnreadCount:
      type: object
      required: [total, mentions, reports, system]
      properties:
        total: { type: integer }
        mentions: { type: integer }
        reports: { type: integer }
        system: { type: integer }
    ThreadAnchor:
      type: object
      description: 'Exactly one of finding_id (a finding card) or pointer (an extracted value, JSON pointer into extraction.deal).'
      oneOf:
        - { required: [finding_id] }
        - { required: [pointer] }
      properties:
        finding_id: { type: string, format: uuid }
        pointer: { type: string }
        rule_id: { type: [string, 'null'], readOnly: true, description: 'copied from the finding, so the anchor still reads after the rules re-run' }
    CommentAuthor:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Comment:
      type: object
      required: [id, thread_id, author, body, mentions, created_at, edited_at]
      properties:
        id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/CommentAuthor' }
        body: { type: string }
        mentions: { type: array, items: { type: string, format: uuid }, description: user ids }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
    Thread:
      type: object
      required: [id, upload_id, anchor, status, created_by, created_at, comments]
      description: |
        Internal to TAO; never shown to partners, in the portal or in a notification. A thread lives on the upload, so a
        correction (same upload, next version) keeps its threads; `version` is the publication version current when the
        thread started (null before the first publish), so the UI can mark "from version 1". A corrected re-issue (new
        upload) also lists the replaced upload's threads, each with its own upload_id.
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        anchor: { $ref: '#/components/schemas/ThreadAnchor' }
        status: { type: string, enum: [open, resolved] }
        version: { type: [integer, 'null'] }
        created_by: { $ref: '#/components/schemas/CommentAuthor' }
        created_at: { type: string, format: date-time }
        resolved_by: { oneOf: [ { $ref: '#/components/schemas/CommentAuthor' }, { type: 'null' } ] }
        resolved_at: { type: [string, 'null'], format: date-time }
        comments: { type: array, items: { $ref: '#/components/schemas/Comment' }, description: oldest first }
    CommentRequest:
      type: object
      required: [body]
      description: 'mentions: ids of active TAO users only (else 422 `bad_mention`); each is notified once.'
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions: { type: array, items: { type: string, format: uuid }, default: [] }
    ThreadCreate:
      type: object
      required: [anchor, body]
      properties:
        anchor: { $ref: '#/components/schemas/ThreadAnchor' }
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions: { type: array, items: { type: string, format: uuid }, default: [] }
    ApproveRequest:
      type: object
      description: 'Optional body; an empty body (as today) is the same as note_to_partners null.'
      properties:
        note_to_partners: { type: [string, 'null'], maxLength: 2000 }
    Recipients:
      type: object
      required: [notified, not_notified]
      description: |
        Who a publish of this upload's deal would notify, computed from subscriptions, partner visibility (the
        partner_filter rule), user status, notification prefs and partner_notifications_enabled. The same list applies
        to a correction of the upload.
      properties:
        notified:
          type: array
          items:
            type: object
            required: [user_id, name, partner_slug, channels]
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string }
              partner_slug: { type: [string, 'null'] }
              channels: { type: array, items: { type: string, enum: [in_app, email] } }
        not_notified:
          type: array
          items:
            type: object
            required: [user_id, name, reason]
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string }
              partner_slug: { type: [string, 'null'] }
              reason: { type: string, enum: [not_subscribed, deactivated, not_visible, switched_off, partner_notifications_off] }
    CompanyDealRef:
      type: object
      required: [deal_slug, deal_name, program_slug, program_name, latest_period, worst_status, next_report]
      properties:
        deal_slug: { type: string }
        deal_name: { type: string }
        program_slug: { type: string }
        program_name: { type: string }
        latest_period: { type: [string, 'null'], pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: 'collection_period of its latest publication; null if never published' }
        worst_status: { type: [string, 'null'], enum: [BREACH, WATCH, OK, null] }
        next_report:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [period, due_on, late, business_days_late]
              description: |
                From the reporting_calendar setting (decision D8). period = latest_period + 1 month. due_on = the expected
                day in the month the next settlement falls in, found by applying the latest publication's offset between
                settlement_date and collection_period (MOVE Trust: the following month; F-PIL 2.0: the same month), clamped
                to the month's last day. late once 5 business days (Mon-Fri) have passed after due_on with no upload of that
                period. null when the deal has no expected day or was never published.
              properties:
                period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                due_on: { type: string, format: date }
                late: { type: boolean }
                business_days_late: { type: integer, minimum: 0 }
    CompanyRow:
      type: object
      required: [slug, name, deals, industry, status, breach, watch, balance, delinquency, news_7d, adverse, following]
      description: 'One row per company, over the deals the caller may see. Figures from each deal''s latest publication.'
      properties:
        slug: { type: string }
        name: { type: string }
        deals: { type: array, items: { $ref: '#/components/schemas/CompanyDealRef' } }
        industry: { type: [string, 'null'] }
        status: { type: [string, 'null'], enum: [BREACH, WATCH, OK, null], description: worst across its deals }
        breach: { type: integer, description: BREACH covenants across its deals }
        watch: { type: integer }
        balance: { type: [number, 'null'], description: sum of tranche_balance.closing across its deals }
        delinquency:
          type: object
          required: [min, max, direction]
          description: 'Latest delinquency_ratio_pct per deal (a fraction: 0.0131 = 1.31%); min = max for one deal; direction against the prior month of the deal with the highest value. null fields when no deal reports it.'
          properties:
            min: { type: [number, 'null'] }
            max: { type: [number, 'null'] }
            direction: { type: [string, 'null'], enum: [up, down, flat, null] }
        news_7d: { type: integer, description: 'kept news items (check_status kept) with a confirmed publish date in the last 7 days' }
        adverse:
          type: object
          required: [state, to_review]
          properties:
            state: { type: string, enum: [clear, to_review, not_screened], description: 'not_screened: no successful news run has covered this company yet. Partners never see to_review (open items are TAO only); for them it reads clear.' }
            to_review: { type: integer, description: open items (TAO); always 0 for partners }
        notes: { type: integer, description: 'TAO only: count of live notes. Absent for partners.' }
        following: { type: boolean, description: 'the caller follows it; false in demo mode' }
    Company:
      type: object
      required: [slug, name, aliases, industry, naics, headquarters, website, relationship_since, relationship_since_source, owner, deals, contacts, following, updated_at]
      description: 'The company record plus its visible deals. TAO Admin edits the record (company_change audit, Platform). Partners get the same object without owner and with contacts as listed.'
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string }
        aliases: { type: array, items: { type: string }, description: 'extra names the news search uses, e.g. a short form' }
        industry: { type: [string, 'null'] }
        naics: { type: [string, 'null'] }
        headquarters: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        relationship_since: { type: [string, 'null'], pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        relationship_since_source: { type: [string, 'null'], enum: [record, first_vintage, null], description: 'record: TAO Admin set it; first_vintage: the earliest cnl_by_period vintage start across its deals' }
        owner: { oneOf: [ { $ref: '#/components/schemas/CommentAuthor' }, { type: 'null' } ], description: TAO relationship owner (a TAO user) }
        deals: { type: array, items: { $ref: '#/components/schemas/CompanyDealRef' } }
        contacts: { type: array, items: { $ref: '#/components/schemas/CompanyContact' } }
        following: { type: boolean }
        updated_at: { type: string, format: date-time }
        news_search: { $ref: '#/components/schemas/CompanyNewsSearch' }
    CompanyNewsSearch:
      type: object
      required: [context_terms, exclusions, languages]
      description: 'TAO only (absent for partners). How the news search treats this company (decision E7). Claude gets all three as guidance; the context-term rule and the exclusions are also applied before the check.'
      properties:
        context_terms: { type: array, items: { type: string, minLength: 2 }, description: 'for a generic name: a story must mention at least one of these (e.g. leasing, equipment, finance). Empty = no context rule.' }
        exclusions: { type: array, items: { type: string, minLength: 2 }, description: 'phrases that always mean the wrong company; a story containing one is dropped before the check' }
        languages: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [en, fr] }, description: 'languages searched; default both' }
    CompanyCreate:
      type: object
      required: [slug, name, deal_slugs, reason]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        name: { type: string, minLength: 1 }
        aliases: { type: array, items: { type: string } }
        deal_slugs: { type: array, items: { type: string }, description: 'deals moved to this company (a deal belongs to one company)' }
        reason: { type: string, minLength: 3 }
    CompanyPatch:
      type: object
      required: [reason]
      description: 'Only the fields sent change. deal_slugs, when sent, is the full list; a deal taken away is left on no company and shows as its own row named after the deal until linked again.'
      properties:
        name: { type: string, minLength: 1 }
        aliases: { type: array, items: { type: string } }
        industry: { type: [string, 'null'] }
        naics: { type: [string, 'null'] }
        headquarters: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        relationship_since: { type: [string, 'null'], pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: 'null returns to the first-vintage default' }
        owner_user_id: { type: [string, 'null'], format: uuid, description: an active TAO user }
        deal_slugs: { type: array, items: { type: string } }
        news_search: { $ref: '#/components/schemas/CompanyNewsSearch' }
        reason: { type: string, minLength: 3 }
    CompanyContact:
      type: object
      required: [id, name, role, email, receives]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        receives: { type: [string, 'null'], description: 'free text, e.g. Monthly SetRep, Covenant queries' }
    CompanyContactInput:
      type: object
      required: [name, reason]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        receives: { type: [string, 'null'] }
        reason: { type: string, minLength: 3 }
    SeriesPoint:
      type: object
      required: [month, value]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        value: { type: [number, 'null'] }
    MetricSeries:
      type: object
      required: [metric, label, unit, deal, program_median, program_mean, peers_in_month, limit]
      description: |
        One ratio_history field over the last 13 months of the deal's latest publication (decisions D2, D3). deal: this
        deal. program_median and program_mean: over the other companies with a deal in the same program that reports the
        same field for that month in its latest publication, one point per company, unweighted (median is the default
        line). A company with several such deals (TLFC) counts once, at the median of its deals' values. This company's own
        deals are left out. null for a month with fewer than 2 such companies. peers_in_month: how many companies that is.
        limit: the covenant threshold whose covenant reads this metric, if any. No industry average.
      properties:
        metric: { type: string, enum: [delinquency_ratio_pct, rolling_3month_loss_ratio_pct, rolling_12month_loss_ratio_pct, loss_ratio_pct, interest_coverage_ratio, debt_equity_ratio, total_equity] }
        label: { type: string }
        unit: { type: string, enum: [fraction, ratio, currency] }
        deal: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        program_median: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        program_mean: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        peers_in_month: { type: array, items: { type: object, required: [month, count], properties: { month: { type: string }, count: { type: integer } } } }
        limit: { oneOf: [ { type: 'null' }, { type: object, required: [legal_ref, threshold, kind], properties: { legal_ref: { type: string }, threshold: { type: number }, kind: { type: string, enum: [ceiling, floor] } } } ] }
    LossPeer:
      type: object
      required: [deal_slug, deal_name, metric, series, drawn]
      description: 'Decision D4: loss comparison with named peers on the same measure only. Same-program deals reporting the same rolling loss field. drawn false (listed, not plotted) when its range is more than 10x this deal''s.'
      properties:
        deal_slug: { type: string }
        deal_name: { type: string }
        metric: { type: string }
        series: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' } }
        drawn: { type: boolean }
    WatchSignal:
      type: object
      required: [kind, severity, title, detail, anchor]
      description: |
        Computed from published data on read, never typed by a person, same for TAO and partners. kinds:
        covenant_near_limit (a covenant at WATCH: within the program watch buffer of its limit), rising_3m (a ratio moving
        the bad way 3 or more months running), obligor_near_limit (largest obligor above 90% of its concentration limit,
        where the report gives one), losses_high (latest month's losses the highest in period_history), utilization_high
        (program_utilization_pct above 85%), restated (a restatements entry or a TAO correction in the latest
        publication), report_late (next_report.late).
      properties:
        kind: { type: string, enum: [covenant_near_limit, rising_3m, obligor_near_limit, losses_high, utilization_high, restated, report_late] }
        severity: { type: string, enum: [watch, rising, info] }
        title: { type: string }
        detail: { type: string }
        anchor: { type: string, description: 'section id on the profile page, e.g. chart-delinquency_ratio_pct, covenant-history, obligors, restatements' }
    CovenantHistoryRow:
      type: object
      required: [legal_ref, description, cells]
      description: 'Published status for months with a publication of this deal; earlier months recomputed from ratio_history with the covenant definitions in force for that month and the program watch buffer (source recomputed). Binary covenants with no series: null.'
      properties:
        legal_ref: { type: string }
        description: { type: string }
        cells:
          type: array
          items:
            type: object
            required: [month, status, source]
            properties:
              month: { type: string }
              status: { type: [string, 'null'], enum: [BREACH, WATCH, OK, AVAILABLE, null] }
              source: { type: [string, 'null'], enum: [published, recomputed, null] }
    CompanyInsights:
      type: object
      required: [deal_slug, collection_period, signals, series, loss_peers, covenant_history, restatements]
      description: 'Everything on the profile that is computed, for one deal in its latest publication. Pool balance, KPIs and top obligors are read from the published deal object itself (/published/...).'
      properties:
        deal_slug: { type: string }
        collection_period: { type: string }
        signals: { type: array, items: { $ref: '#/components/schemas/WatchSignal' } }
        series: { type: array, items: { $ref: '#/components/schemas/MetricSeries' } }
        loss_peers: { type: array, items: { $ref: '#/components/schemas/LossPeer' } }
        balance_median_change: { type: array, items: { $ref: '#/components/schemas/SeriesPoint' }, description: 'program median of closing vs opening change per period_history month, other companies, one point per company as in MetricSeries' }
        covenant_history: { type: array, items: { $ref: '#/components/schemas/CovenantHistoryRow' } }
        restatements:
          type: array
          items:
            type: object
            required: [month, field, first_reported, now, changed_in, type]
            properties:
              month: { type: string }
              field: { type: string }
              first_reported: { type: [number, 'null'] }
              now: { type: [number, 'null'] }
              changed_in: { type: string, description: 'source_period of the report that changed it, or the date TAO applied a correction' }
              type: { type: string, enum: [restated_by_company, tao_correction] }
    NewsSourceName:
      type: string
      enum: [google_news, gdelt, event_registry, newscatcher, brave_news, brave_web, dow_jones, lexisnexis, fixture]
    NewsItem:
      type: object
      required: [id, company_slug, title, url, publisher, published_at, source, sentiment, found_at, source_date, date_status, sources, language]
      properties:
        id: { type: string, format: uuid }
        company_slug: { type: string }
        title: { type: string }
        url: { type: string, format: uri, description: 'the publisher URL where known (resolved_url), else the link the source gave' }
        publisher: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time, description: 'confirmed publish date only: from the article page, or a provider publication field (NewsCatcher published_date, Event Registry date). null when not confirmed.' }
        source_date: { type: [string, 'null'], format: date-time, description: 'the date the search source gave (Google pubDate, GDELT seendate, Brave page_age); often an index or crawl date, never used for counts or alerts' }
        date_status: { type: string, enum: [confirmed, source_only, unknown], description: 'confirmed: published_at is set. source_only / unknown: the screen says "Date not confirmed".' }
        source: { $ref: '#/components/schemas/NewsSourceName' }
        sources: { type: array, items: { $ref: '#/components/schemas/NewsSourceName' }, description: every source that found this story }
        language: { type: [string, 'null'], enum: [en, fr, null] }
        sentiment: { type: string, enum: [positive, neutral, negative], description: 'from the Claude check (keyword screening for unchecked rows from before wave E)' }
        found_at: { type: string, format: date-time }
        check:
          description: 'TAO only (absent for partners). The Claude check on this story.'
          type: object
          required: [status, confidence, reason, model, checked_at]
          properties:
            status: { type: string, enum: [kept, excluded, pending, unchecked], description: 'pending: the check could not run yet (retried each run; never shown to partners). unchecked: from before wave E, awaiting the re-check.' }
            confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
            reason: { type: [string, 'null'], description: one line from the check, e.g. "About a Mexico City property market, not the lender" }
            model: { type: [string, 'null'] }
            checked_at: { type: [string, 'null'], format: date-time }
    AdverseItem:
      type: object
      required: [id, company_slug, category, title, url, publisher, found_at, state, note, state_by, state_at]
      description: 'Partners see reviewed items only (decision D6); open and dismissed are TAO only.'
      properties:
        id: { type: string, format: uuid }
        company_slug: { type: string }
        news_item_id: { type: [string, 'null'], format: uuid }
        category: { type: string, enum: [litigation, regulatory, fraud, insolvency, sanctions], description: 'keyword screening of news text; sanctions here is a keyword hit, not a sanctions-list check' }
        title: { type: string }
        url: { type: string, format: uri }
        publisher: { type: [string, 'null'] }
        found_at: { type: string, format: date-time }
        state: { type: string, enum: [open, reviewed, dismissed] }
        note: { type: [string, 'null'], description: review note or dismiss reason }
        state_by: { oneOf: [ { $ref: '#/components/schemas/CommentAuthor' }, { type: 'null' } ] }
        state_at: { type: [string, 'null'], format: date-time }
    AdverseDecision:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 3, description: 'review note, or dismiss reason (e.g. different entity)' }
    CompanyNote:
      type: object
      required: [id, company_slug, author, body, mentions, collection_period, created_at, edited_at]
      description: TAO only. Never returned by any partner route.
      properties:
        id: { type: string, format: uuid }
        company_slug: { type: string }
        author: { $ref: '#/components/schemas/CommentAuthor' }
        body: { type: string }
        mentions: { type: array, items: { $ref: '#/components/schemas/CommentAuthor' } }
        collection_period: { type: [string, 'null'], pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: 'the report month the note is about, if any' }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
    CompanyNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000, description: '@Name mentions as in comments; mentioned TAO users get a mention notification linking to /admin/companies/<slug>?note=<id>' }
        mentions: { type: array, items: { type: string, format: uuid } }
        collection_period: { type: [string, 'null'], pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    NewsRun:
      type: object
      required: [id, trigger, status, queued_at, started_at, finished_at, companies, items_added, adverse_added, errors]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string, enum: [schedule, manual, recheck] }
        status: { type: string, enum: [queued, running, ok, partial, failed] }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        companies: { type: integer }
        items_added: { type: integer }
        adverse_added: { type: integer }
        errors: { type: array, items: { type: object, required: [source, message], properties: { company_slug: { type: [string, 'null'] }, source: { type: string }, message: { type: string } } } }
        stats:
          type: object
          description: 'Filled as the run goes; {} for runs from before wave E.'
          properties:
            calls: { type: object, additionalProperties: { type: integer }, description: requests per source }
            capped: { type: array, items: { type: string }, description: sources that hit their daily request cap this run }
            candidates: { type: integer }
            kept: { type: integer }
            excluded: { type: integer }
            pending: { type: integer }
            date_confirmed: { type: integer }
            claude_input_tokens: { type: integer }
            claude_output_tokens: { type: integer }
    NewsSource:
      type: object
      required: [provider, label, available, enabled, fields, secrets, config, last_test]
      description: 'A paid news source and the client credentials for it (TAO Admin only). Secret values never leave the API; secrets shows only whether each is set and its last four characters.'
      properties:
        provider: { type: string, enum: [event_registry, newscatcher, brave, dow_jones, lexisnexis] }
        label: { type: string, description: 'e.g. "Event Registry (newsapi.ai)"' }
        available: { type: boolean, description: 'false for Dow Jones and LexisNexis until their adapter is built from the client''s API documentation; credentials can still be stored' }
        note: { type: [string, 'null'], description: 'shown under the row, e.g. "Needs the client''s API documentation" or "Free plan: last 30 days only"' }
        enabled: { type: boolean }
        fields:
          type: array
          description: the provider's fields, in display order
          items:
            type: object
            required: [name, label, secret, required]
            properties:
              name: { type: string, description: 'e.g. api_key, client_id, client_secret, user_key, base_url, archive_months, news, web' }
              label: { type: string }
              secret: { type: boolean }
              required: { type: boolean }
              kind: { type: string, enum: [text, url, boolean, integer], default: text }
              help: { type: [string, 'null'] }
        secrets: { type: object, additionalProperties: { type: object, required: [set, last4], properties: { set: { type: boolean }, last4: { type: [string, 'null'] } } } }
        config: { type: object, description: 'non-secret field values, e.g. {"archive_months": 12} or {"news": true, "web": true}' }
        last_test:
          type: object
          required: [at, ok, message]
          properties:
            at: { type: [string, 'null'], format: date-time }
            ok: { type: [boolean, 'null'] }
            message: { type: [string, 'null'], description: 'e.g. "OK: 12 results for the test query" or the provider''s error' }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { oneOf: [ { $ref: '#/components/schemas/CommentAuthor' }, { type: 'null' } ] }
    NewsSourceUpdate:
      type: object
      required: [reason]
      description: 'Only what is sent changes. secrets: a field set to a string replaces it, set to null removes it; fields not sent keep their stored value. news_source_change audit with which fields changed, never the values.'
      properties:
        enabled: { type: boolean }
        config: { type: object }
        secrets: { type: object, additionalProperties: { type: [string, 'null'] } }
        reason: { type: string, minLength: 3 }
    Setting:
      type: object
      required: [key, value, updated_at, updated_by]
      description: |
        Keys (any other is 422 `unknown_setting`):
        partner_notifications_enabled: boolean, default false. Off: no partner notifications are created.
        reporting_calendar: {deal_slug: expected_day (1-31)}; feeds "next report due" and the overdue check.
        notification_defaults: {role: [NotificationPref]}; applies to new users and "Reset to defaults", never to choices
        people already made.
        publish_note_templates: {new_report: string, correction: string}; fields in braces ({deal_name},
        {collection_period}, {program_name}, {covenant_summary}, {change_list}, {reason}) are filled when the dialog opens.
        company_feeds: {enabled: boolean (default false), run_at: "HH:MM" (default "06:00"), time_zone: IANA (default
        America/Toronto), sources: subset of [google_news, gdelt] (the free sources; default both; paid sources are switched
        on per source under /news/sources), daily_cap: requests per source per day (1-5000, default 200)}. Read by the news
        worker each minute.
        company_profiles_partner_enabled: boolean, default false. Off: partners get 404 on /companies* and no Companies
        nav entry (Me.features.companies), and receive no adverse_media or negative_news notifications.
        Not settings: validation rules and tolerances (contracts/rules.yaml) and extraction templates are read-only on
        screen; data retention is fixed (kept indefinitely; notifications 12 months).
      properties:
        key: { type: string, enum: [partner_notifications_enabled, reporting_calendar, notification_defaults, publish_note_templates, company_feeds, company_profiles_partner_enabled] }
        value: { description: any JSON, shape per key }
        updated_at: { type: [string, 'null'], format: date-time, description: 'null while the default applies' }
        updated_by: { type: [string, 'null'] }
    SettingChange:
      type: object
      required: [value, reason]
      properties:
        value: { description: any JSON, shape per key }
        reason: { type: string, minLength: 3 }

paths:
  /uploads:
    post:
      summary: Create an upload and queue extraction (TAO)
      description: |
        A period already published for the deal is refused (409 `already_published`) unless `replace` is true: then the
        upload is a corrected re-issue, `replaces_upload_id` names the published upload, R12 raises a block finding
        that says what it replaces (and which later periods are already published), and approving it replaces the
        publication; the old upload gets `replaced_by_upload_id` and both stay in the audit log.
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [deal_slug, collection_period, file]
              properties:
                deal_slug: { type: string }
                collection_period: { type: string, pattern: '^\d{4}-\d{2}$' }
                file: { type: string, format: binary }
                replace: { type: boolean, default: false, description: 'corrected re-issue of a published period' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`already_published` (R12 pre-check) or `upload_in_progress`' }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      summary: List uploads (queue and history)
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UploadStatus' } }
        - { name: deal_slug, in: query, schema: { type: string } }
        - { name: collection_period, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Upload' } } } } }
  /uploads/{upload_id}:
    get:
      summary: One upload with status and finding counts
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /uploads/{upload_id}/extraction:
    get:
      summary: Latest extraction (pass 2 if it ran, else pass 1)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' }, { name: pass, in: query, schema: { type: integer, enum: [1, 2] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Extraction' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /uploads/{upload_id}/findings:
    get:
      summary: Findings for the latest extraction
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Finding' } } } } }
  /uploads/{upload_id}/findings/{finding_id}/override:
    post:
      summary: Resolve a finding with a reason; rules re-run; audit entry written (tao_admin only)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' }, { name: finding_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OverrideRequest' } } } }
      responses:
        '200': { description: Updated findings after re-run, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Finding' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`not_open`, `bad_state` or `no_target`' }
  /uploads/{upload_id}/reextract:
    post:
      summary: Queue a targeted second pass over named pages
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReextractRequest' } } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state`' }
  /uploads/{upload_id}/approve:
    post:
      summary: Approve; applies use_ours / use_report values (see OverrideRequest), publishes and regenerates dashboards (tao_admin only; refused while block findings are open)
      description: >
        Optional body {note_to_partners}. The note is stored on the publication version (PublicationVersion.note_to_partners)
        and sent as note_from_tao in the report_published notifications to the recipients GET /uploads/{upload_id}/recipients
        lists; the publish audit entry records the note and the recipients.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ApproveRequest' } } } }
      responses:
        '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`open_block_findings`, `conflicting_corrections`, `correction_inconsistent`, `bad_state` or `no_extraction`' }
        '422': { $ref: '#/components/responses/Invalid', description: '`invalid` (note longer than 2000)' }
  /uploads/{upload_id}/recipients:
    get:
      summary: Who a publish or correction of this upload would notify, and who not and why (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UploadId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recipients' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /uploads/{upload_id}/threads:
    get:
      summary: Comment threads on this upload, open first (TAO only; partners 403)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UploadId' }, { name: status, in: query, schema: { type: string, enum: [open, resolved] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Thread' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Start a thread on a finding or a value, with its first comment (TAO Admin or Analyst, needs a user); writes a comment audit entry (Reports)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UploadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ThreadCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Thread' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid', description: '`bad_mention`, or `invalid` (finding not on this upload, pointer not in the extraction)' }
  /uploads/{upload_id}/edits:
    get:
      summary: Value edits on this upload, newest first, reverted ones included (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ValueEdit' } } } } } }
    post:
      summary: Edit one extracted number while in review (tao_admin); re-runs the rules; writes a value_edit audit entry
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValueEditRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValueEditResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state` (not needs_review / approved; a published report takes a correction)' }
        '422': { description: '`invalid`: pointer not found or not a number in the extraction' }
  /uploads/{upload_id}/edits/{edit_id}/revert:
    post:
      summary: Revert a value edit (tao_admin); re-runs the rules; writes a value_edit_revert audit entry
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' }, { name: edit_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValueEditResult' } } } }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state` or `already_reverted`' }
  /uploads/{upload_id}/corrections:
    get:
      summary: Corrections of this published upload, newest first (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Correction' } } } } } }
    post:
      summary: Correct values of a published report without a new PDF (tao_admin); publishes as the next version, or waits in the queue if a block finding opens; writes a correction audit entry
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionRequest' } } } }
      responses:
        '200': { description: Published or queued, content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state` (not published, or replaced by a re-issue) or `correction_pending` (one is already waiting)' }
        '422': { description: '`invalid`: a pointer not found or not a number' }
  /corrections:
    get:
      summary: Corrections across uploads, for the approval queue (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: status, in: query, schema: { type: string, enum: [needs_review, published, rejected] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Correction' } } } } } }
  /corrections/{correction_id}:
    get:
      summary: One correction with the findings of its rule re-run (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: correction_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Correction' }, { type: object, properties: { findings: { type: array, items: { type: object } } } } ] } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /corrections/{correction_id}/findings/{finding_id}/override:
    post:
      summary: Resolve a block finding on a queued correction (tao_admin). Only restatement or acknowledge; a correction's values are its edits, so use_ours / use_report are refused (409 `bad_choice`).
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: correction_id, in: path, required: true, schema: { type: string, format: uuid } }, { name: finding_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OverrideRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_choice` or `bad_state`' }
  /corrections/{correction_id}/approve:
    post:
      summary: Publish a queued correction as its version (tao_admin; refused while block findings are open); writes correction_approve and publish entries
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: correction_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } } }
        '409': { $ref: '#/components/responses/Conflict', description: '`open_block_findings` or `bad_state`' }
  /corrections/{correction_id}/reject:
    post:
      summary: Discard a queued correction (tao_admin); the current version stays; writes correction_reject
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: correction_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectRequest' } } } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } } }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state`' }
  /uploads/{upload_id}/reject:
    post:
      summary: Reject with a reason (tao_admin only)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectRequest' } } } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state`' }
  /uploads/{upload_id}/pages/{n}.png:
    get:
      summary: Page image for the finding card and the page viewer
      description: >
        Rendered at `dpi` (default 110, the finding-card crop). The page viewer asks for 200 or 300 so zoomed numbers stay
        sharp. Each dpi is cached separately; source bboxes stay in PDF points, so clients scale them by the image's real
        width divided by the page width in points, never by a fixed dpi.
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { $ref: '#/components/parameters/UploadId' }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: dpi, in: query, required: false, schema: { type: integer, enum: [110, 200, 300], default: 110 } }
      responses:
        '200': { description: PNG, content: { image/png: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /uploads/{upload_id}/file:
    get:
      summary: The original PDF (TAO only)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/UploadId' } ]
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /master/partners:
    get:
      summary: Partners (TAO; tao_analyst read-only)
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Partner' } } } } } }
  /master/programs:
    get:
      summary: Programs (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Program' } } } } } }
    put:
      summary: Upsert a program (tao_admin)
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Program' } } } }
      responses: { '200': { description: OK } }
  /master/deals:
    get:
      summary: Deals (TAO)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: program_slug, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Deal' } } } } } }
    put:
      summary: Upsert a deal (tao_admin)
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Deal' } } } }
      responses: { '200': { description: OK } }
  /master/covenants:
    get:
      summary: Covenant definitions, versioned by effective_from (TAO). Current rows only, unless include_history=true.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { name: deal_slug, in: query, schema: { type: string } }, { name: as_of, in: query, schema: { type: string, format: date } }, { name: include_history, in: query, schema: { type: boolean, default: false } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CovenantDefinition' } } } } } }
    put:
      summary: Change a covenant definition (tao_admin); see CovenantChange. Never updates a row in place.
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CovenantChange' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CovenantChangeResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`not_current` (correct on a superseded row), `exists` (add for a legal_ref the deal already has), `effective_not_later` (new_version not after the current one)' }

  /published/portfolio:
    get:
      summary: Portfolio executive summary, filtered to the caller's partner
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublishedPortfolio' } } } } }
  /published/programs/{program_slug}:
    get:
      summary: Program executive summary + dashboard data (partner-filtered)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { name: program_slug, in: path, required: true, schema: { type: string } }, { name: period, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublishedProgram' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /published/programs/{program_slug}/deals/{deal_slug}:
    get:
      summary: Published deal page data (partner-filtered)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { name: program_slug, in: path, required: true, schema: { type: string } }, { name: deal_slug, in: path, required: true, schema: { type: string } }, { name: period, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }, { name: version, in: query, schema: { type: integer, minimum: 1 }, description: 'an earlier publication version; default the current one' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublishedDeal' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /published/regenerate:
    post:
      summary: Rebuild program roll-ups from published deals (tao_admin); writes a regenerate audit entry
      parameters: [ { $ref: '#/components/parameters/XRole' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { program_slug: { type: string } } } } } }
      responses: { '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/RegenerateResult' } } } } }

  /audit:
    get:
      summary: Audit log (at most `limit` rows, default 100). scope=reports is readable by tao_admin and tao_analyst; scope=platform (and no scope) by tao_admin only.
      description: >
        Newest first. Scope is derived from the action, not stored: reports = entries with an upload_id, plus publish and
        regenerate (so comment, comment_edit, thread_resolve, thread_reopen are reports); platform = everything else
        (master_change, export, user_change, prefs_change, settings_change). Months are calendar months in
        America/Toronto. q searches action, actor, reason, deal and detail text across every month unless `month` is given.
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { name: upload_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [reports, platform] } }
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'YYYY-MM, America/Toronto' }
        - { name: q, in: query, schema: { type: string, minLength: 2 } }
        - { name: actor_role, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid }, description: 'entries by one user (Profile, My activity). A user may always read their own; other users need the scope rule above.' }
        - { name: deal_slug, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit/months:
    get:
      summary: Entry counts per month for one scope (History list), newest first
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [reports, platform] } }
        - { name: q, in: query, schema: { type: string, minLength: 2 }, description: 'with q, counts matching entries only' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { type: object, required: [month, count], properties: { month: { type: string }, count: { type: integer } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit/export.csv:
    get:
      summary: One month of one scope as CSV, one row per entry; writes its own `export` entry to the platform log
      description: >
        Columns: at, at_toronto, scope, action, actor, deal, period, upload_id, finding_id, reason, detail (JSON), id. The rows are
        read first and the export entry is written afterwards, so an export never lists itself.
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [reports, platform] } }
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /threads/{thread_id}/comments:
    post:
      summary: Add a comment to an open thread (TAO, needs a user); mentions notify; replies notify the thread's other people; writes a comment audit entry (Reports)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/ThreadId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommentRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state` (thread resolved; reopen it first)' }
        '422': { $ref: '#/components/responses/Invalid', description: '`bad_mention`' }
  /comments/{comment_id}:
    patch:
      summary: Edit your own comment (author only, else 403 `not_author`); shown as edited; the old text is kept in a comment_edit audit entry (Reports). Comments cannot be deleted.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { name: comment_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommentRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid', description: '`bad_mention`; only newly added mentions are notified' }
  /threads/{thread_id}/resolve:
    post:
      summary: Resolve a thread (any TAO Admin, or the thread's starter); does not change the finding; writes thread_resolve (Reports)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/ThreadId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Thread' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state` (already resolved)' }
  /threads/{thread_id}/reopen:
    post:
      summary: Reopen a resolved thread (any TAO Admin, or the thread's starter); writes thread_reopen (Reports)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/ThreadId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Thread' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state` (already open)' }

  /me:
    get:
      summary: The caller (every role); user is null in demo mode
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Change your own name and display settings (needs a user); writes a prefs_change audit entry (Platform). Role, email and partner are not self-editable.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MePatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }
  /me/notification-prefs:
    get:
      summary: Your notification settings, one row per kind your role can receive (needs a user)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationPref' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Replace your notification settings (kinds left out go back to the defaults); writes a prefs_change audit entry (Platform)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationPref' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationPref' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid', description: '`required` (covenant_changed or correction_published switched off) or `invalid` (a kind the role cannot receive)' }

  /users:
    get:
      summary: Users (tao_admin sees all; a partner Company Admin sees only its own partner's users; others 403 `company_admin_only`)
      description: >
        partner_slug filters by partner (`tao` lists TAO users); for a Company Admin it is forced to their own partner. q
        matches name and email. TAO Analyst may read only `partner_slug=tao&status=active` (the @mention list: id, name, email, role, status); every other query is 403 for an analyst (C3).
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { $ref: '#/components/parameters/XPartner' }
        - { $ref: '#/components/parameters/XUser' }
        - { name: partner_slug, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, deactivated] } }
        - { name: q, in: query, schema: { type: string, minLength: 2 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AppUser' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Add a user (active, no subscriptions); writes a user_change audit entry (Platform)
      description: >
        tao_admin may add any role. A Company Admin (investor_admin, manager_admin) may add only its own partner's
        admin or viewer; any other role or partner is 409 `other_partner`.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppUserCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AppUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`other_partner` or `email_taken`' }
        '422': { $ref: '#/components/responses/Invalid', description: '`role_partner_mismatch`, `unknown_partner` or `invalid`' }
  /users/{user_id}:
    get:
      summary: One user (tao_admin; a Company Admin for its own partner's users, else 404)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Change name, email, role or partner; writes a user_change audit entry with before and after (Platform)
      description: >
        Same scope as POST /users. Nobody changes their own role (409 `self_change`). A change that leaves no active
        tao_admin, or a partner without an active Company Admin, is 409 `last_admin`.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UserId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppUserPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`self_change`, `last_admin`, `other_partner` or `email_taken`' }
        '422': { $ref: '#/components/responses/Invalid', description: '`role_partner_mismatch`, `unknown_partner` or `invalid`' }
  /users/{user_id}/deactivate:
    post:
      summary: Deactivate (there is no hard delete); the user's X-User then gets 401 `inactive_user`; writes a user_change audit entry (Platform)
      description: 'Same scope as POST /users. Not yourself (409 `self_change`); not the last active tao_admin or a partner''s last active Company Admin (409 `last_admin`).'
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UserId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChangeRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`self_change`, `last_admin` or `already_deactivated`' }
  /users/{user_id}/reactivate:
    post:
      summary: Reactivate the same account; writes a user_change audit entry (Platform)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UserId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChangeRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`already_active`' }
  /users/{user_id}/subscriptions:
    get:
      summary: Reports this user is notified about (tao_admin; a Company Admin for its own partner's users; the user themselves, read-only)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Replace the whole subscription list (tao_admin; a Company Admin for its own partner's users); writes a user_change audit entry with before and after (Platform)
      description: >
        A partner user may subscribe only to programs shared with their partner (422 `not_visible`). Subscriptions decide
        who is notified and never widen what a partner can see.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { $ref: '#/components/parameters/UserId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid', description: '`not_visible`, `email_later`, `unknown_program`, `unknown_deal` or `invalid` (deal not in the program)' }

  /notifications:
    get:
      summary: Your own notifications, newest first (every role; needs a user). See Notification for who gets what.
      parameters:
        - { $ref: '#/components/parameters/XRole' }
        - { $ref: '#/components/parameters/XPartner' }
        - { $ref: '#/components/parameters/XUser' }
        - { name: tab, in: query, schema: { type: string, enum: [all, mentions, reports, system], default: all } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/unread-count:
    get:
      summary: Your unread counts per tab, for the sidebar badge
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnreadCount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notification_id}/read:
    post:
      summary: Mark one of your notifications read (another person's is 404)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: notification_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      summary: Mark all your notifications in one tab read (default all)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: tab, in: query, schema: { type: string, enum: [all, mentions, reports, system], default: all } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [marked], properties: { marked: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      summary: System settings, every key with its current value or default (tao_admin)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Setting' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/{key}:
    put:
      summary: Change one setting with a reason (tao_admin); writes a settings_change audit entry with before and after (Platform)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XUser' }, { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingChange' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Setting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid', description: '`unknown_setting` or `invalid` (value does not fit the key)' }

  /companies:
    get:
      summary: Lending companies the caller may see, one row each (TAO; partners while company_profiles_partner_enabled, through partner_filter)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: following, in: query, schema: { type: boolean }, description: 'only companies the caller follows' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CompanyRow' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create a company and link deals to it (tao_admin); company_change audit (Platform)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`slug_taken`' }
        '422': { $ref: '#/components/responses/Invalid' }
  /companies/{company_slug}:
    get:
      summary: The company record and its visible deals (404 for a partner with no shared deal in it)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit the company record or its deal links (tao_admin); company_change audit with before and after
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /companies/{company_slug}/deals/{deal_slug}/insights:
    get:
      summary: Computed profile sections for one of the company's deals, from its latest publication (signals, comparison series, covenant history, restatements)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } }, { name: deal_slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyInsights' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound', description: 'unknown, not this company''s, not visible, or never published' }
  /companies/{company_slug}/news:
    get:
      summary: 'News items for the company, newest first by published_at, else source_date, else found_at. Kept and unchecked stories; TAO can add excluded and pending ones with include. Partners get kept stories only.'
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } }, { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }, { name: sentiment, in: query, schema: { type: string, enum: [positive, neutral, negative] } }, { name: include, in: query, schema: { type: string, enum: [excluded, pending, all] }, description: 'TAO only; ignored for partners. excluded: also the stories the check excluded; pending: also those awaiting the check; all: both.' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NewsItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /companies/{company_slug}/adverse:
    get:
      summary: Adverse media items, newest first (TAO every state; partners reviewed only)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } }, { name: state, in: query, schema: { type: string, enum: [open, reviewed, dismissed] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdverseItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /adverse/{adverse_id}/review:
    post:
      summary: Mark an open adverse item reviewed, with a note (tao_admin); adverse_change audit; following partners are notified
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: adverse_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseDecision' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state`' }
  /adverse/{adverse_id}/dismiss:
    post:
      summary: Dismiss an open adverse item with a reason (tao_admin); adverse_change audit; never shown to partners
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: adverse_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseDecision' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`bad_state`' }
  /companies/{company_slug}/notes:
    get:
      summary: Analyst notes, newest first (TAO only; partners 403)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CompanyNote' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Add a note (both TAO roles; needs a user); company_note audit; @mentions notify
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyNoteInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyNote' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /company-notes/{note_id}:
    patch:
      summary: Edit your own note (author only, 403 not_author); company_note_edit audit keeps the old text
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: note_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyNoteInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyNote' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Remove a note from view (author or tao_admin); the row is kept and the company_note_edit audit records the removal
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: note_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /companies/{company_slug}/contacts:
    post:
      summary: Add a key contact (tao_admin); company_change audit
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyContactInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyContact' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /company-contacts/{contact_id}:
    patch:
      summary: Edit a contact (tao_admin); company_change audit
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyContactInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompanyContact' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Remove a contact from the record (tao_admin, reason in query); the row is kept, company_change audit
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }, { name: reason, in: query, required: true, schema: { type: string, minLength: 3 } } ]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /companies/{company_slug}/follow:
    put:
      summary: Follow the company (needs a user; any role that can see it). Followers get adverse_media and negative_news.
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Stop following (needs a user)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: company_slug, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Not following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /news/runs:
    get:
      summary: Recent news runs, newest first (TAO only), for the run status line and System settings
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NewsRun' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Run the news search now (tao_admin); queues a manual run on the news queue; news_run audit
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/NewsRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`run_active` or `feeds_off`' }
  /news/recheck:
    post:
      summary: 'Re-check every stored story with the date and Claude checks (tao_admin); queues a recheck run; news_run audit. Allowed while feeds are off.'
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/NewsRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: '`run_active`' }
  /news/sources:
    get:
      summary: The paid news sources, their fields and whether credentials are set (tao_admin)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [secret_key_set, sources], properties: { secret_key_set: { type: boolean, description: 'NEWS_SECRET_KEY is set on the server; false = credentials cannot be stored (the screen says so)' }, sources: { type: array, items: { $ref: '#/components/schemas/NewsSource' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /news/sources/{provider}:
    put:
      summary: Switch a source on or off, change its settings, or replace or remove credentials, with a reason (tao_admin); news_source_change audit (Platform)
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: provider, in: path, required: true, schema: { type: string, enum: [event_registry, newscatcher, brave, dow_jones, lexisnexis] } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewsSourceUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NewsSource' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`no_secret_key`, `not_available`, `missing_credentials`' }
        '422': { $ref: '#/components/responses/Invalid', description: '`invalid`: an unknown field, a secret sent as config, or a value of the wrong kind' }
  /news/sources/{provider}/test:
    post:
      summary: 'Test the stored credentials with one small query (tao_admin). The news worker runs it; poll GET /news/sources until last_test.at changes (normally a few seconds; the worker gives up after 30 s and records that).'
      parameters: [ { $ref: '#/components/parameters/XRole' }, { $ref: '#/components/parameters/XPartner' }, { $ref: '#/components/parameters/XUser' }, { name: provider, in: path, required: true, schema: { type: string, enum: [event_registry, newscatcher, brave, dow_jones, lexisnexis] } } ]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/NewsSource' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: '`no_secret_key`, `not_available`, `missing_credentials`' }

  /health:
    get:
      summary: Liveness for compose and the contract check
      responses: { '200': { description: OK } }
