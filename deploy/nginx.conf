# TAO Admin POC: the built web app plus /api passed to the API container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 100m;          # SetRep PDF uploads
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # re-extraction and large PDF requests
        proxy_send_timeout 300s;
    }

    # Built files carry a content hash in their name: cache them for a year.
    # (A location with its own add_header drops the server-level ones, so each location repeats all three.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    # Every other path is a page of the app: serve index.html, never cached, so a new release shows at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
